name: Test

on:
  pull_request:
    branches:
      - main
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    name: Jest
    runs-on: ubuntu-latest

    env:
      CI: true
      NODE_ENV: test
      API_PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: revelo_test
      JWT_SECRET: test-jwt-secret-key-for-ci
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-for-ci
      AI_BASE_URL: http://localhost:8000
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: test@example.com
      SMTP_PASS: test-smtp-password
      SMTP_EMAIL: test@example.com

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revelo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "23"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.2.2

      - name: Install dependencies
        run: pnpm install

      - name: Run database migrations
        run: pnpm db:create; pnpm db:migrate

      - name: Run tests
        run: pnpm test

  test-ai:
    name: Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai/requirements*.txt

      - name: Install dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt -r requirements-dev.txt

      - name: Cache search model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: search-model-${{ hashFiles('ai/config.py') }}

      - name: Run tests
        run: pytest
